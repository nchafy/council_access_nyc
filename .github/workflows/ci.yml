name: CI

on:
  push:
    branches: [mainline]
  pull_request:

# The build needs no secrets, so there is nothing for a malicious dependency or
# pull request to exfiltrate. Least privilege makes that explicit.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs, not tags, because §4.5 requires it and this
      # file did not do it. A tag is a movable pointer: `@v4` means "whatever that org
      # pushes to that tag next", and a compromised action runs with the job's
      # permissions. The trailing comment records which release each SHA was, since a
      # bare SHA is unreadable and would otherwise never be updated.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      # Hermetic: every parser test runs against a committed fixture under
      # tests/fixtures/, so CI never depends on nyc.legistar.com being up or on a
      # city dataset keeping its shape. Contract tests that DO hit upstream are
      # marked `upstream` and run on a schedule instead, so a third party can
      # never redden this build.
      #
      # This job also carries the artifact contract, in
      # tests/integration/test_artifacts.py: the counts a consumer indexes by, the
      # geometry size budget, and the assertion that the build writes those eight files
      # and nothing else. All arithmetic over committed bytes, so no browser is involved
      # anywhere in this repository since 2026-11-09.
      - name: Tests
        run: uv run pytest -m "not upstream"

  # The build needs the cached upstream payloads in etl/raw/, which are gitignored
  # (78 MB, re-fetchable). Until CI can populate that cache, this job can only run where
  # it is already present, so it is skipped rather than silently passing on an empty
  # build.
  site:
    runs-on: ubuntu-latest
    if: false # enable once CI can populate etl/raw/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync
      - run: uv run showup build
      # Against the real data and the real geometry, which the fixture build cannot
      # cover: the fixture's districts layer is about 9 KB where the citywide one is
      # 153 KB, so the 300 KB gzipped budget is only genuinely exercised here.
      - run: uv run pytest -m "not upstream" tests/integration/test_artifacts.py
