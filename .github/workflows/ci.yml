name: CI

on:
  push:
    branches: [mainline]
  pull_request:

# The build needs no secrets, so there is nothing for a malicious dependency or
# pull request to exfiltrate. Least privilege makes that explicit.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      # Hermetic: every parser test runs against a committed fixture under
      # tests/fixtures/, so CI never depends on nyc.legistar.com being up or on a
      # city dataset keeping its shape. Contract tests that DO hit upstream are
      # marked `upstream` and run on a schedule instead, so a third party can
      # never redden this build.
      - name: Tests
        run: uv run pytest -m "not upstream and not browser"

  # The site build needs the cached upstream payloads in etl/raw/, which are
  # gitignored (78 MB, re-fetchable). Until `showup fetch` exists, this job can
  # only run where that cache is present, so it is skipped rather than silently
  # passing on an empty build.
  site:
    runs-on: ubuntu-latest
    if: false # enable once `showup fetch` lands and CI can populate etl/raw/
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run showup build
      - run: uv run python scripts/verify.py
