[project]
name = "showup"
version = "0.1.0"
description = "Show Up NYC — what the NYC City Council is doing this week and what you can still do about it"
requires-python = ">=3.12"
# Open-source dependencies are allowed — see docs/dependencies.md for the checklist.
# All three are build-time only: one renders `site/`, the others read scraped pages and
# the boards' schedule PDFs, and none reaches a reader. A BROWSER dependency is still
# refused, because "zero third parties" is a CSP-enforced promise. All three are
# `py3-none-any`, bs4 is used with the stdlib `html.parser` backend, and pypdf needs no
# runtime dependency at all on 3.12 — so no compiled parser of any kind enters the
# install surface. Asserted in tests/unit/test_html_parsing.py and test_board_pdf.py.
dependencies = [
    "beautifulsoup4>=4.15.0",
    "jinja2>=3.1.6",
    "pypdf>=6.21.4",
]

[project.optional-dependencies]
# OCR, for the two boards that publish their agendas only as scanned images. Deliberately
# an extra and not a runtime dependency: it is two orders of magnitude heavier than
# everything else here — platform wheels for onnxruntime and PDFium, plus ~15 MB of
# models — and `showup build` must not require it. A machine without it builds those two
# boards short, which is the same contract a dead third-party site already has, and the
# registry's `needs` field is what expresses that. See docs/dependencies.md.
ocr = [
    "pypdfium2>=5.14.0",
    "rapidocr-onnxruntime>=1.4.4",
]

[project.scripts]
showup = "showup.cli:main"

[dependency-groups]
# `websocket-client` drives the browser gates from `scripts/cdp.py` and is deliberately
# NOT a runtime dependency: `showup build` must not need it. Pure Python, no compiled
# extension, nothing executed at install — the rule that still rules out Playwright.
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "websocket-client>=1.9.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `templates/*.html` are package data and hatchling already ships them under this
# setting. `PackageLoader` reads them from the installed package, so anything that
# excluded them here would only fail after install.
packages = ["src/showup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--cov=showup",
    "--cov-report=term-missing",
    # 100% is the floor, not a target: see CLAUDE.md. When new code drops
    # coverage, the answer is a test, never a lower number.
    "--cov-fail-under=100",
]
filterwarnings = ["error"]
markers = [
    "upstream: hits a real third-party host; excluded from CI, run on a schedule",
    "browser: needs a local Chrome; excluded from the default run",
    "slow: takes more than a few seconds; still runs by default",
]

[tool.coverage.run]
# `cdp.py` is the Chrome DevTools client. It moved into the package when the browser
# became a way of *loading* a board's schedule and not only a way of testing the site, and
# that brought it under this gate — where it cannot honestly sit. Every line of it needs a
# real Chrome, so the only way to cover it is `make browser`, which the default `make
# check` deliberately excludes. Measuring it here would make the 100% floor depend on a
# browser being installed, which is exactly the coupling the `needs` field exists to
# avoid. `tests/browser/test_cdp.py` is where it is actually exercised.
omit = ["src/showup/cdp.py"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
# Ruff reformats Python snippets inside Markdown. The skill files are
# documentation whose snippets are deliberately elided and illustrative, so
# formatting them is noise that would fail CI for prose reasons.
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "PTH", "RET", "ARG", "TID", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG"]
# The ambiguous-character rule is right in general and wrong here: these files
# deliberately contain the en dash, figure dash and minus sign that appear in
# Legistar's clerk-typed location strings. Normalising them would delete the
# thing under test.
"src/showup/venues.py" = ["RUF001"]
"tests/unit/test_venues.py" = ["RUF001"]
# Same rule, same reason, for the boards' schedule PDFs: these patterns deliberately
# contain the en dash and em dash a board types in a time range, and the curly apostrophe
# in `Veterans’ Day`, which slipped past a pattern spelling only the straight one.
# Normalising them would delete the thing being matched.
"src/showup/sources/board_pdf.py" = ["RUF001", "RUF003"]
# Same rule, same reason: these strip the en dash and em dash an Airtable cell carries
# around a committee name. Normalising them would delete what is being stripped.
"src/showup/sources/board_browser.py" = ["RUF001"]
"tests/unit/test_board_pdf.py" = ["RUF001", "ARG"]
# Source adapters import their own package's shared primitives by relative path.
# TID252 exists to stop reaching across package boundaries; staying inside one
# package is the intent, and absolute self-imports would be noise.
"src/showup/sources/*.py" = ["TID252"]
# The handler's class attributes are configuration set once before the server
# starts, which is how http.server is designed to be parameterised.
"scripts/serve.py" = ["RUF012"]
