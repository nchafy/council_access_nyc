<!DOCTYPE html>
<!--
  The negative control for the axe gate.

  The site passed axe on the first run it was ever given, which is a result that
  cannot be distinguished from a gate that does not work. This page carries one
  deliberate instance of six WCAG A/AA failures, and
  tests/browser/test_a11y.py::TestTheGateCanFail asserts the gate finds every one of
  them. If that test ever passes trivially, the real clean result is worth nothing.

  Do not fix the markup below. Every defect in it is the point. It is never linked
  from the site and never copied into site/.
-->
<html>
<head>
<meta charset="utf-8">
<!-- An external stylesheet, not a <style> block. The gate serves fixtures behind the
     real `_headers`, where `style-src 'self'` blocks inline CSS — so an inline block
     applied to nothing and the contrast defect went unreported. See broken.css. -->
<link rel="stylesheet" href="/broken.css">
</head>
<body>
<!-- html-has-lang: no lang attribute on <html>. -->
<!-- document-title: no <title> element. -->
<p class="faint">Written testimony is accepted for 72 hours after adjournment.</p>

<!-- image-alt: no alt text, and not marked decorative. -->
<img src="/assets/nothing.png" width="8" height="8">

<!-- label: an input with no associated label and no accessible name. -->
<form action="/district/">
  <input type="text" name="address">
  <button type="submit">Find</button>
</form>

<!-- link-name: an anchor with an href and no discernible text. -->
<a href="/district/35/"><span></span></a>

<!-- Nested interactive content, flagged by nested-interactive. -->
<button type="button">Tell me <a href="/board/">more</a></button>
</body>
</html>
